[project]
name = "gamedev-trends"
version = "0.1.0"
description = "Trend radar for indie game developers"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14,<3",
    "confluent-kafka>=2.16,<3",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs the docker compose stack (Kafka on localhost:9092)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

# Every variable, parameter and return value is typed. ty is the reference checker;
# tests/test_annotations.py covers variables, which no checker requires.
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
