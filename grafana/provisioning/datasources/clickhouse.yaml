apiVersion: 1
datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: clickhouse
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      username: radar
      defaultDatabase: radar
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
